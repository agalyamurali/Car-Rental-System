<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Your Ride - rentRideX</title>
    <style>
        /* Deep Blue Background */
        body {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background: url('https://m.media-amazon.com/images/I/71H3Wsh8rrL.jpg') no-repeat center center fixed;
            
            background-size: cover;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            height: 100vh;
            margin: 0;
            color: white;
        }
        .nav-bar{
        display: flex;
        justify-content: space-around;
        align-items: center;
        }
        .logo img{
        position: absolute;
        top: -30px;
        left: 3px;
        padding: 0;
        height: 180px;
        }

        .nav-list-holder{
  
        width:60%;
        margin-top: 30px;
        }
        .nav-list{
        display: flex;
        justify-content: space-between;
        align-items: center;
        list-style: none;
        }
        .link{
        display: inline-block ; /* without inline block or display style transform doesn't work*/
        text-decoration: none;
        color: silver;
        font-size: medium;
        font-weight: 600;
        transition: all .6s ease;
        }
        .link:hover{
        transform: translateY(-8px);
        color: gold;
        }

        /* Glassmorphism Effect */
        .container {
            background: rgba(10, 10, 50, 0.9); /* Deep Royal Blue */
            backdrop-filter: blur(10px);
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6); /* Gold Glow */
            text-align: center;
            border: 2px solid gold; /* Golden Border */
            position: absolute;
            left:10%;
            margin-top: 30px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: gold; /* Royal Gold */
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        /* Elegant Input Fields */
        input, select {
            background: rgba(255, 255, 255, 0.2);
            color: #f5d442; 
            border: 1px solid gold;
        }
        select{
            color:yellow;
        }

        /* Change Placeholder Color */
        input::placeholder {
            color: #f5d442; /* Light Gold */
        }

        /* Stylish Golden Button */
        button {
            background: linear-gradient(135deg, #FFD700, #DAA520); /* Gold Gradient */
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 3px 8px rgba(255, 215, 0, 0.6);
        }

        button:hover {
            background: linear-gradient(135deg, #DAA520, #FFD700);
            transform: scale(1.05);
            box-shadow: 0 5px 12px rgba(255, 215, 0, 0.9);
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="logo">
            <img src="assets/logo.png" alt="" data-aos ='fade-up' data-aos-duration="1400">
        </div>
        <div class="nav-list-holder">
            <ul class="nav-list">
               <li data-aos = 'flip-down' data-aos-duration="1400" data-aos-delay="300"><a href="home.html" class="link">Home</a></li>
               <li data-aos = 'flip-down' data-aos-duration="1400" data-aos-delay="300"> <a href="RentalForm.html" class="link" >Rent Car</a></li>
               <li data-aos = 'flip-down' data-aos-duration="1400" data-aos-delay="400"><a href="Car Availablity.html" class="link">Available Cars</a></li>
               <li data-aos = 'flip-down' data-aos-duration="1400" data-aos-delay="500"><a href="RentedCars.html"  class="link">Rented Cars</a></li>
            </ul>
        </div>
    </div>

    <div class="container">
        <h2>🚗 Book Your Luxury Ride</h2>

        <form action="http://localhost:8080/bookings" method="post">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="number" name="phone" placeholder="Your Phone Number"required>
            <input type="number" name="days" min="1" placeholder="Number of Days" required>
            <select name="model" required>
                <option value="" disabled selected>Select Car Model</option>
                <option value="">-- Select a car --</option>
                <option value="Toyota Innova">Toyota Innova - 7 seats</option>
                <option value="Hyundai i20">Hyundai i20 - 5 seats</option>
                <option value="Honda Amaze">Honda Amaze - 5 seats</option>
                <option value="Maruti Ertiga">Maruti Ertiga - 7 seats</option>
                <option value="Tata Nexon">Tata Nexon - 5 seats</option>
                <option value="Kia Seltos">Kia Seltos - 5 seats</option>
                <option value="Mahindra XUV500">Mahindra XUV500 - 7 seats</option>
                <option value="Renault Triber">Renault Triber - 7 seats</option>
                <option value="Volkswagen Polo">Volkswagen Polo - 4 seats</option>
                <option value="Ford EcoSport">Ford EcoSport - 5 seats</option>
                <option value="Skoda Fabia">Skoda Fabia - 4 seats</option>
                <option value="MG Comet EV">MG Comet EV - 4 seats</option>
                <option value="Suzuki Swift">Suzuki Swift - 5 seats</option>
                <option value="Hyundai Santro">Hyundai Santro - 4 seats</option>
                <option value="Toyota Fortuner">Toyota Fortuner - 7 seats</option>
                <option value="Tata Nano">Tata Nano - 4 seats</option>
                <option value="Nissan Micra">Nissan Micra - 4 seats</option>
                <option value="Jeep Compass">Jeep Compass - 5 seats</option>
                <option value="Mahindra Scorpio">Mahindra Scorpio - 7 seats</option>
                <option value="Maruti Baleno">Maruti Baleno - 5 seats</option>
                

            </select>
            

            <button type="submit">🚀 Reserve Now</button>
        </form>
    </div>
        <script src="script.js"></script>
</body>
</html>
